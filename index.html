  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    :root {
      --bg-primary: #0b0c10;
      --bg-secondary: #12141c;
      --bg-card: rgba(22, 25, 35, 0.78);
      --gold-light: #f6e29f;
      --gold-main: #d4af37;
      --gold-dark: #9e7b1e;
      --gold-gradient: linear-gradient(135deg, #f7e4a3 0%, #d4af37 50%, #a67c1e 100%);
      --text-main: #f5f3ee;
      --text-muted: #b5b0a4;

      --transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.7;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.09) 0%, transparent 40%),
        radial-gradient(circle at 85% 75%, rgba(212, 175, 55, 0.07) 0%, transparent 45%);
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      background: rgba(11, 12, 16, 0.82);
      border-bottom: 1px solid var(--border-gold);
    }
